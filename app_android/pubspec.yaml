name: chofer_log
description: Matopiba Log - Gestão de frotas para motoristas.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  # Declarado direto para usar MediaType (Content-Type do upload de comprovante).
  # Já presente como transitive (via http) na mesma versão do lock.
  http_parser: ^4.0.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.0.4
  # Seleção de documentos fiscais do frete (PDF/XML/imagem) no detalhe do frete.
  # image_picker só pega imagens/galeria; file_picker cobre PDF e XML.
  file_picker: ^8.1.2
  # Abrir/compartilhar documentos do frete: baixa o arquivo (signed URL do
  # bucket privado) para um temp com path_provider e abre a folha de
  # compartilhamento nativa (WhatsApp, visualizadores etc.). path_provider já
  # está declarado abaixo.
  share_plus: ^10.1.4
  uuid: ^4.3.3
  intl: ^0.18.1
  connectivity_plus: ^5.0.2
  workmanager: ^0.9.0
  sqflite: ^2.3.0
  path_provider: ^2.1.2
  path: ^1.9.1
  # Push (FCM). O app compila e roda mesmo sem google-services.json: o
  # PushService trata Firebase.initializeApp de forma tolerante (ver push_service.dart).
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  # Exibe a notificacao quando o app esta em primeiro plano (o FCM so mostra
  # automaticamente em background/terminado). Requer coreLibraryDesugaring no
  # android/app/build.gradle.kts (habilitado neste PR; minSdk 21 usa java.time).
  flutter_local_notifications: ^17.2.3
  # Scanner de documentos (POC). Usa o ML Kit Document Scanner no Android
  # (detecção de borda + crop + realce, sem C++/NDK). Encapsulado em
  # services/document_scanner_service.dart e AINDA NÃO ligado à UI — o anexo por
  # câmera/galeria/arquivo segue como fluxo/fallback. minSdk 21 já atende (README
  # exige >=21). Traz permission_handler transitivo (só usado no iOS pelo plugin).
  cunning_document_scanner: ^2.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.8

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/Logo_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/Logo_icon.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/LOGOMARCA.png
  android: true
  ios: false
  web: false
  android_12:
    color: "#FFFFFF"
    image: assets/Logo_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/Logo.png
    - assets/LOGOMARCA.png
