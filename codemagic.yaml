workflows:

  # ──────────────────────────────────────────────────────────────────────────
  # Workflow 1 — APK Debug (use este primeiro para validar o pipeline)
  # ──────────────────────────────────────────────────────────────────────────
  android-debug:
    name: Android APK Debug
    max_build_duration: 60
    environment:
      flutter: stable
      java: 21
    scripts:
      - name: Remover java.home local do gradle.properties
        script: |
          GRADLE_PROPS="app_android/android/gradle.properties"
          if [ -f "$GRADLE_PROPS" ]; then
            grep -v '^org.gradle.java.home=' "$GRADLE_PROPS" > "$GRADLE_PROPS.tmp" || true
            mv "$GRADLE_PROPS.tmp" "$GRADLE_PROPS"
          fi

      - name: Flutter clean, pub get, analyze e build debug
        script: |
          cd app_android
          flutter clean
          flutter pub get
          flutter analyze --no-fatal-infos || true
          flutter build apk --debug

    artifacts:
      - app_android/build/app/outputs/flutter-apk/app-debug.apk

  # ──────────────────────────────────────────────────────────────────────────
  # Workflow 2 — APK Release (use após debug funcionar; sem assinatura por ora)
  # ──────────────────────────────────────────────────────────────────────────
  android-release:
    name: Android APK Release (sem assinatura)
    max_build_duration: 60
    environment:
      flutter: stable
      java: 21
    scripts:
      - name: Remover java.home local do gradle.properties
        script: |
          GRADLE_PROPS="app_android/android/gradle.properties"
          if [ -f "$GRADLE_PROPS" ]; then
            grep -v '^org.gradle.java.home=' "$GRADLE_PROPS" > "$GRADLE_PROPS.tmp" || true
            mv "$GRADLE_PROPS.tmp" "$GRADLE_PROPS"
          fi

      - name: Flutter clean, pub get, analyze e build release
        script: |
          cd app_android
          flutter clean
          flutter pub get
          flutter analyze --no-fatal-infos || true
          flutter build apk --release

    artifacts:
      - app_android/build/app/outputs/flutter-apk/app-release.apk
