name: Pilot Acceptance V1

on:
  pull_request:
    branches: [feature/pilot-ready-v1]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pilot-acceptance-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend full suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: node --test

  postgres-088:
    name: PostgreSQL 17 migration 088
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      FREIGHT_IDEMPOTENCY_088_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      FREIGHT_IDEMPOTENCY_088_PG: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: node --test --test-concurrency=1 tests-pg/freight_creation_idempotency_088.pgtest.mjs

  frontend:
    name: Frontend tests, build and pilot browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: painel_web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: painel_web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test pilot_acceptance.visual.spec.ts -c tests-e2e-visual/playwright.config.ts
      - name: Upload sanitized browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot-acceptance-browser-evidence
          path: painel_web/test-results
          if-no-files-found: ignore
          retention-days: 14

  sec1-browser:
    name: SEC-1 browser with PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sec1_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sec1_e2e
      NODE_ENV: test
      SEC1_E2E_AUTH_FAKE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            painel_web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: backend
      - run: npm ci --no-audit --no-fund
        working-directory: painel_web
      - run: npx playwright install --with-deps chromium
        working-directory: painel_web
      - run: npm run test:e2e:sec1
        working-directory: painel_web

  flutter:
    name: Flutter analyze, test and release APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: app_android
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: pilot-acceptance-release-apk
          path: app_android/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
