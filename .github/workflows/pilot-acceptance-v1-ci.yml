name: Pilot Acceptance V1

on:
  pull_request:
    branches: [feature/pilot-ready-v1]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pilot-acceptance-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend full suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: node --test

  postgres-088:
    name: PostgreSQL 17 migration 088
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      FREIGHT_IDEMPOTENCY_088_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      FREIGHT_IDEMPOTENCY_088_PG: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: node --test --test-concurrency=1 tests-pg/freight_creation_idempotency_088.pgtest.mjs

  api-e2e:
    name: Freight API E2E with PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      PILOT_API_E2E_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      PILOT_API_E2E_PG: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: >-
          node --test --test-concurrency=1
          tests-pg/pilot_acceptance_api_e2e.pgtest.mjs
          tests-pg/pilot_acceptance_canonical_route.pgtest.mjs

  supabase-isolated:
    name: Supabase CLI isolated Auth, PostgREST, Storage and RLS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Start pinned official Supabase services
        run: >-
          npx --yes supabase@2.121.0 start
          --workdir tests-supabase
          --exclude studio,imgproxy,realtime,mailpit,postgres-meta,edge-runtime,logflare,vector,supavisor
      - name: Export ephemeral local identity
        shell: bash
        run: |
          eval "$(npx --yes supabase@2.121.0 status --workdir tests-supabase -o env)"
          {
            echo "PA037_SUPABASE_API_URL=$API_URL"
            echo "PA037_SUPABASE_DB_URL=$DB_URL"
            echo "PA037_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "PA037_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "PA037_ISOLATED_SUPABASE=1"
          } >> "$GITHUB_ENV"
      - name: Exercise official Auth, PostgREST, Storage and repository RLS
        run: node --test --test-concurrency=1 tests-supabase/pa037.supabase.test.mjs
      - name: Destroy local Supabase volumes
        if: always()
        run: npx --yes supabase@2.121.0 stop --workdir tests-supabase --no-backup

  frontend:
    name: Frontend tests, build and pilot browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: painel_web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: painel_web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test pilot_acceptance.visual.spec.ts -c tests-e2e-visual/playwright.config.ts
      - name: Upload sanitized browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot-acceptance-browser-evidence
          path: painel_web/test-results
          if-no-files-found: ignore
          retention-days: 14

  sec1-browser:
    name: SEC-1 browser with PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sec1_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sec1_e2e
      NODE_ENV: test
      SEC1_E2E_AUTH_FAKE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            painel_web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: backend
      - run: npm ci --no-audit --no-fund
        working-directory: painel_web
      - run: npx playwright install --with-deps chromium
        working-directory: painel_web
      - run: npm run test:e2e:sec1
        working-directory: painel_web

  flutter:
    name: Flutter analyze, test and safe homologation APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: app_android
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build environment negative guards
        shell: bash
        run: |
          if dart run tool/verify_build_environment.dart; then
            echo "::error::Missing build configuration was accepted"
            exit 1
          fi
          if dart run tool/verify_build_environment.dart APP_ENV=homologation API_BASE_URL=https://example-production.up.railway.app HOMOLOGATION_BACKEND_VERIFIED=true; then
            echo "::error::Railway production target was accepted"
            exit 1
          fi
          if dart run tool/verify_build_environment.dart APP_ENV=homologation API_BASE_URL=https://api.homologacao.example HOMOLOGATION_BACKEND_VERIFIED=true REQUIRE_WRITES=true; then
            echo "::error::Build declaration enabled writes without runtime identity attestation"
            exit 1
          fi
          if dart run tool/verify_build_environment.dart APP_ENV=homologation API_BASE_URL=https://api.matopibalog.com.br HOMOLOGATION_BACKEND_VERIFIED=true REQUIRE_WRITES=true; then
            echo "::error::Custom production domain enabled homologation writes"
            exit 1
          fi
          dart run tool/verify_build_environment.dart APP_ENV=homologation API_BASE_URL=https://homologacao.invalid HOMOLOGATION_BACKEND_VERIFIED=false
      - name: Build safe homologation APK (test-signed, writes blocked)
        env:
          MATOPIBA_HOMOLOGATION_BUILD: "1"
        run: >-
          flutter build apk --release
          --dart-define=APP_ENV=homologation
          --dart-define=API_BASE_URL=https://homologacao.invalid
          --dart-define=HOMOLOGATION_BACKEND_VERIFIED=false
      - name: Verify APK identity and production endpoint absence
        shell: bash
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | grep -F "package: name='br.com.matopibalog.app.homologation'"
          "$AAPT" dump badging "$APK" | grep -F "application-label:'Matopiba Log Homologacao'"
          for PRODUCTION_ENDPOINT in \
            "matopibalog-backend-production.up.railway.app" \
            "api.matopibalog.com.br"; do
            if grep -aF "$PRODUCTION_ENDPOINT" "$APK"; then
              echo "::error::Production endpoint found in homologation APK: $PRODUCTION_ENDPOINT"
              exit 1
            fi
          done
          sha256sum "$APK" | tee build/app/outputs/flutter-apk/app-release.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: pilot-acceptance-homologation-safe-apk
          path: |
            app_android/build/app/outputs/flutter-apk/app-release.apk
            app_android/build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 14
