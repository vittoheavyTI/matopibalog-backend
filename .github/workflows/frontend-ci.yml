name: Frontend CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "painel_web/**"
      - ".github/workflows/frontend-ci.yml"

  push:
    branches:
      - main
    paths:
      - "painel_web/**"
      - ".github/workflows/frontend-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node 22 - Frontend tests & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: painel_web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: painel_web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests (vitest)
        run: npm test

      - name: Typecheck + build
        run: npm run build
