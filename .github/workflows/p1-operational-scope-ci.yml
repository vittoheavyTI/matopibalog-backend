name: P1 Operational Scope PG

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "backend/migrations/**"
      - "backend/tests-pg/**"
      - ".github/workflows/p1-operational-scope-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/migrations/**"
      - "backend/tests-pg/**"
      - ".github/workflows/p1-operational-scope-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-operational-scope-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pg-p1:
    name: Postgres 16 - P1 migration 067 real
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: p1_scope_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/p1_scope_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply fresh schema through migration 067
        run: npm run test:pg:apply

      - name: Run P1 operational scope PG tests
        run: node --test --test-concurrency=1 tests-pg/operational_scope.pgtest.mjs
