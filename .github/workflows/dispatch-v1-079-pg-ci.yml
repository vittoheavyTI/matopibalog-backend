name: Dispatch V1 079 Atomic Offers PG

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "backend/migrations/**"
      - "backend/tests-pg/**"
      - ".github/workflows/dispatch-v1-079-pg-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/migrations/**"
      - "backend/tests-pg/**"
      - ".github/workflows/dispatch-v1-079-pg-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dispatch-v1-079-pg-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pg-079:
    name: Postgres 16 - Dispatch V1 079 atomic offers
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dispatch_079_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/dispatch_079_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Show runtime versions
        run: node --version && npm --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Dispatch V1 079 atomic offer PG tests (chain 058..079)
        run: node --test --test-concurrency=1 tests-pg/dispatch_v1_079.pgtest.mjs
