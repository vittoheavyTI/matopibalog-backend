name: ERP Hub 084 PG

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "backend/migrations/084_erp_integration_hub_operational_core.sql"
      - "backend/tests-pg/erp_hub_084.pgtest.mjs"
      - "backend/tests-pg/apply_schema.mjs"
      - ".github/workflows/erp-hub-084-pg-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/migrations/084_erp_integration_hub_operational_core.sql"
      - "backend/tests-pg/erp_hub_084.pgtest.mjs"
      - "backend/tests-pg/apply_schema.mjs"
      - ".github/workflows/erp-hub-084-pg-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erp-hub-084-pg-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  erp-hub-084-pg:
    name: Postgres 16 - ERP Hub 084
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erp_hub_084_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/erp_hub_084_test
      ERP_HUB_084_PG: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Show runtime versions
        run: node --version && npm --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply isolated schema through migration 084
        run: npm run test:pg:apply

      - name: Run ERP Hub 084 PG tests
        run: node --test --test-concurrency=1 tests-pg/erp_hub_084.pgtest.mjs
