name: DB Security Definer 083 PG

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "backend/migrations/083_security_definer_hardening.sql"
      - "backend/tests-pg-dbsec/**"
      - ".github/workflows/db-security-definer-083-pg-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/migrations/083_security_definer_hardening.sql"
      - "backend/tests-pg-dbsec/**"
      - ".github/workflows/db-security-definer-083-pg-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-security-definer-083-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  db-security-definer-083:
    name: Postgres 16 - DB security definer 083
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dbsec083_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/dbsec083_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Show runtime versions
        run: node --version && npm --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run DB-SEC-1 migration 083 PG test
        run: node --test --test-concurrency=1 tests-pg-dbsec/db_security_definer_083.pgtest.mjs
