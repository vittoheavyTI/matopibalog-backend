name: App CI (Flutter Android)

# CI mobile ISOLADO (SEC-1). Roda analyze + test + build APK DEBUG do app Flutter
# em runner efêmero. SEM keystore, SEM signing real, SEM publicação, SEM secrets de
# loja. Actions fixadas por SHA; Flutter e Java com versão explícita (não "stable"
# flutuante). O primeiro run nesta branch = BASELINE (app ainda idêntico a 567fcc6);
# runs seguintes = HEAD após as alterações de auth do app.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "app_android/**"
      - ".github/workflows/app-ci.yml"
  push:
    branches: [main]
    paths:
      - "app_android/**"
      - ".github/workflows/app-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.24.5"   # Dart 3.5.x — casa com sdk >=3.0.0 <4.0.0 do pubspec
  JAVA_VERSION: "21"          # mesmo do Codemagic

jobs:
  app:
    name: Flutter analyze + test + build apk (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app_android

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Setup Java (Temurin)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter (versão fixa)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Versões (registro do baseline)
        run: |
          flutter --version
          dart --version
          java -version

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test --reporter expanded

      - name: flutter build apk --debug (sem signing/keystore)
        run: flutter build apk --debug

      - name: Upload APK debug (artifact — sem signing)
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: app-debug-apk
          path: app_android/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
          retention-days: 7
