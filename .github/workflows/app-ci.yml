name: App CI (Flutter Android)

# CI mobile ISOLADO (SEC-1). Roda analyze + test + build APK DEBUG do app Flutter
# em runner efêmero. SEM keystore, SEM signing real, SEM publicação, SEM secrets de
# loja. Actions fixadas por SHA; Flutter e Java com versão explícita (não "stable"
# flutuante). O primeiro run nesta branch = BASELINE (app ainda idêntico a 567fcc6);
# runs seguintes = HEAD após as alterações de auth do app.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "app_android/**"
      - ".github/workflows/app-ci.yml"
  push:
    branches: [main]
    paths:
      - "app_android/**"
      - ".github/workflows/app-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.0"   # bate com pubspec.lock (sdks: flutter >=3.44.0, dart >=3.12.0)
  JAVA_VERSION: "21"          # mesmo do Codemagic

jobs:
  app:
    name: Flutter analyze + test + build apk (debug + release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app_android

    steps:
      # SEC-1 build identity: no evento pull_request, o github.sha é o MERGE-ref
      # sintético — não o HEAD do PR. Fazemos checkout EXPLÍCITO do HEAD real do PR
      # (head.sha), com fallback para github.sha em push/workflow_dispatch, para que
      # o código COMPILADO seja exatamente o HEAD selado, não só o rótulo exibido.
      - name: Checkout (HEAD real do PR; fallback github.sha)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Java (Temurin)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter (versão fixa)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Versões (registro do baseline)
        run: |
          flutter --version
          dart --version
          java -version

      - name: flutter pub get
        run: flutter pub get

      # SEC-1 hardening: identidade de build injetada no APK via --dart-define.
      # GIT_SHA = HEAD real do PR (head.sha) / github.sha em push — o MESMO ref do
      # checkout acima. Versão/build derivados do pubspec. A assert garante a regra de
      # aceitação: APK source SHA == PR head_sha == BuildInfo.gitSha.
      - name: Identidade de build (dart-define) + assert HEAD==GIT_SHA
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//')
          HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "APP_VERSION=${VER%%+*}" >> "$GITHUB_ENV"
          echo "APP_BUILD_NUMBER=${VER##*+}" >> "$GITHUB_ENV"
          echo "GIT_SHA=${HEAD_SHA}" >> "$GITHUB_ENV"
          ATUAL=$(git rev-parse HEAD)
          echo "checkout HEAD=${ATUAL}  GIT_SHA=${HEAD_SHA}"
          if [ "${ATUAL}" != "${HEAD_SHA}" ]; then
            echo "::error::Identidade de build inconsistente: HEAD (${ATUAL}) != GIT_SHA (${HEAD_SHA})"
            exit 1
          fi

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test --reporter expanded

      - name: flutter build apk --debug (sem signing/keystore)
        run: >-
          flutter build apk --debug
          --dart-define=GIT_SHA=${{ env.GIT_SHA }}
          --dart-define=APP_VERSION=${{ env.APP_VERSION }}
          --dart-define=APP_BUILD_NUMBER=${{ env.APP_BUILD_NUMBER }}

      - name: Testes JVM nativos (LocationQueueLogic — fila offline)
        working-directory: app_android/android
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: flutter build apk --release (evidencia manual)
        run: >-
          flutter build apk --release
          --dart-define=GIT_SHA=${{ env.GIT_SHA }}
          --dart-define=APP_VERSION=${{ env.APP_VERSION }}
          --dart-define=APP_BUILD_NUMBER=${{ env.APP_BUILD_NUMBER }}

      - name: Upload APK debug (artifact — sem signing)
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: app-debug-apk
          path: app_android/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Upload APK release (artifact - evidencia manual)
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: app-release-apk
          path: app_android/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
